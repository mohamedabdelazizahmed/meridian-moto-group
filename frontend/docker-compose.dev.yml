services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meridian-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - API_INTERNAL_URL=http://host.docker.internal:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
